<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>GadgetsPOS - Password</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <link rel="stylesheet" href="shared/components.css">
  <link rel="stylesheet" href="shared/password.css">
  <link rel="modulepreload" href="shared/ui.js">
  <link rel="modulepreload" href="shared/icons.js">
  <link rel="modulepreload" href="shared/format.mjs">
  <script type="module" src="shared/password.js"></script>
</head>
<body>
  <form class="pw" id="form" novalidate autocomplete="off" aria-labelledby="pw-title">
    <header class="pw__head">
      <span class="tile tile--lg" aria-hidden="true"><i data-icon="drawer" id="pw-icon"></i></span>
      <div class="pw__headings">
        <h1 id="pw-title">Open cash drawer</h1>
        <p class="pw__desc" id="pw-desc">Enter the drawer password to open it.</p>
      </div>
    </header>

    <div class="pw__body">
      <div class="banner banner--warning" id="lock-banner" hidden>
        <span class="banner__icon"><i data-icon="lock"></i></span>
        <div class="banner__body">
          <p class="banner__title">Too many wrong passwords</p>
          <p class="banner__text">Try again in <strong class="tabular" id="lock-time">0:30</strong></p>
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="pw-input">Password</label>
        <div class="input-group">
          <input class="input" id="pw-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="128">
          <button type="button" class="input-group__action" id="pw-reveal"></button>
        </div>
        <div class="field__error" id="pw-error" hidden></div>
      </div>

      <div id="pw-status" class="pw__status" aria-live="polite"></div>
    </div>

    <footer class="pw__foot">
      <button type="button" class="btn" id="pw-cancel">Cancel</button>
      <button type="submit" class="btn btn--primary" id="pw-submit"><span id="pw-submit-label">Open drawer</span></button>
    </footer>
  </form>
</body>
</html>
